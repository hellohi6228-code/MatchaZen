name: Sync tagged Instagram posts

on:
  schedule:
    - cron: '17 */3 * * *'   # every 3 hours
  workflow_dispatch: {}       # "Run workflow" button in the Actions tab

permissions:
  contents: write
  pages: write

concurrency:
  group: sync-tagged
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch tagged posts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node .github/scripts/sync-tagged.mjs

      - name: Commit changes and rebuild the site
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add data/tagged.json assets/tagged
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync tagged Instagram posts"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
